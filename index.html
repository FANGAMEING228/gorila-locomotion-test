<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Always-On Gorilla Tag Locomotion</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #000; }
  #info {
    position: fixed; top: 10px; width: 100%; text-align: center;
    color: white; font-family: sans-serif; z-index: 10; pointer-events: none;
  }
</style>
</head>
<body>
<div id="info">Just swing your arms — grip is always "on". No buttons needed. Hands turn green near the floor.</div>

<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
  }
}
</script>

<script type="module">
import * as THREE from 'three';
import { VRButton } from 'three/addons/webxr/VRButton.js';

let scene, camera, renderer, clock;
let player;
let controller1, controller2;
let hand1Mesh, hand2Mesh;

const velocity = new THREE.Vector3();
const GRAVITY = 9.8;
const PLAYER_RADIUS = 0.4;
const WORLD_LIMIT = 480;
const FLOOR_TOUCH_HEIGHT = 0.15;
const REACH_LIMIT = 0.55;      // max "arm length" before auto re-grab
const DEAD_ZONE = 0.01;        // ignore tiny jitter

const colliders = [];

// Always-on grab state per hand (no button needed, auto re-anchors)
const grabState = {
  left:  { anchorWorld: new THREE.Vector3(), initialized: false },
  right: { anchorWorld: new THREE.Vector3(), initialized: false }
};

init();
renderer.setAnimationLoop(render);

function init() {
  scene = new THREE.Scene();
  scene.background = new THREE.Color(0x8fd3ff);

  camera = new THREE.PerspectiveCamera(70, window.innerWidth / window.innerHeight, 0.01, 1000);

  player = new THREE.Group();
  player.position.set(0, 0, 0);
  player.add(camera);
  scene.add(player);

  const hemi = new THREE.HemisphereLight(0xffffff, 0x444444, 1.2);
  hemi.position.set(0, 20, 0);
  scene.add(hemi);

  const dir = new THREE.DirectionalLight(0xffffff, 1.2);
  dir.position.set(20, 30, 10);
  scene.add(dir);

  // ---- BIG BASEPLATE ----
  const groundGeo = new THREE.PlaneGeometry(1000, 1000);
  const groundMat = new THREE.MeshStandardMaterial({ color: 0x2e8b2e });
  const ground = new THREE.Mesh(groundGeo, groundMat);
  ground.rotation.x = -Math.PI / 2;
  scene.add(ground);

  const grid = new THREE.GridHelper(1000, 200, 0x000000, 0x000000);
  grid.material.transparent = true;
  grid.material.opacity = 0.15;
  scene.add(grid);

  // ---- COLLIDABLE REFERENCE BOXES ----
  const boxGeo = new THREE.BoxGeometry(2, 2, 2);
  for (let i = 0; i < 60; i++) {
    const mat = new THREE.MeshStandardMaterial({ color: Math.random() * 0xffffff });
    const box = new THREE.Mesh(boxGeo, mat);
    box.position.set((Math.random() - 0.5) * 200, 1, (Math.random() - 0.5) * 200);
    scene.add(box);

    box.updateMatrixWorld();
    const bbox = new THREE.Box3().setFromObject(box);
    colliders.push(bbox);
  }

  // ---- RENDERER / VR ----
  renderer = new THREE.WebGLRenderer({ antialias: true });
  renderer.setPixelRatio(window.devicePixelRatio);
  renderer.setSize(window.innerWidth, window.innerHeight);
  renderer.xr.enabled = true;
  renderer.xr.setReferenceSpaceType('local-floor');
  document.body.appendChild(renderer.domElement);
  document.body.appendChild(VRButton.createButton(renderer));

  // ---- CONTROLLERS (no squeeze listeners needed anymore) ----
  controller1 = renderer.xr.getController(0);
  controller2 = renderer.xr.getController(1);
  player.add(controller1);
  player.add(controller2);

  const handGeo = new THREE.SphereGeometry(0.07, 16, 16);
  const handMat1 = new THREE.MeshStandardMaterial({ color: 0xffcc00 });
  const handMat2 = new THREE.MeshStandardMaterial({ color: 0xff5500 });
  hand1Mesh = new THREE.Mesh(handGeo, handMat1);
  hand2Mesh = new THREE.Mesh(handGeo, handMat2);
  controller1.add(hand1Mesh);
  controller2.add(hand2Mesh);

  clock = new THREE.Clock();
  window.addEventListener('resize', onResize);
}

function resolveCollisionsXZ(nextPos) {
  const playerSphere = new THREE.Sphere(
    new THREE.Vector3(nextPos.x, nextPos.y + 1, nextPos.z),
    PLAYER_RADIUS
  );

  for (const box of colliders) {
    const closest = new THREE.Vector3();
    box.clampPoint(playerSphere.center, closest);
    const dist = playerSphere.center.distanceTo(closest);

    if (dist < playerSphere.radius) {
      const pushDir = new THREE.Vector3().subVectors(playerSphere.center, closest);
      if (pushDir.lengthSq() === 0) pushDir.set(1, 0, 0);
      pushDir.normalize();
      const overlap = playerSphere.radius - dist;
      nextPos.x += pushDir.x * overlap;
      nextPos.z += pushDir.z * overlap;
    }
  }

  const distFromCenter = Math.sqrt(nextPos.x * nextPos.x + nextPos.z * nextPos.z);
  if (distFromCenter > WORLD_LIMIT) {
    const scale = WORLD_LIMIT / distFromCenter;
    nextPos.x *= scale;
    nextPos.z *= scale;
  }

  return nextPos;
}

function updateHandFloorFeedback() {
  [controller1, controller2].forEach((controller, i) => {
    const worldPos = new THREE.Vector3();
    controller.getWorldPosition(worldPos);
    const mesh = i === 0 ? hand1Mesh : hand2Mesh;
    if (worldPos.y <= FLOOR_TOUCH_HEIGHT) {
      mesh.material.color.set(0x00ff00); // green = touching floor (crawl technique)
      mesh.scale.setScalar(1.3);
    } else {
      mesh.material.color.set(i === 0 ? 0xffcc00 : 0xff5500);
      mesh.scale.setScalar(1.0);
    }
  });
}

// Processes one hand's always-on grab-pull, returns desired XZ delta for the body
function processHandPull(hand, controller) {
  const state = grabState[hand];
  const currentWorld = new THREE.Vector3();
  controller.getWorldPosition(currentWorld);

  if (!state.initialized) {
    state.anchorWorld.copy(currentWorld);
    state.initialized = true;
    return new THREE.Vector3(0, 0, 0);
  }

  // How far has the hand drifted from the body (world space, XZ only)
  const controllerLocalXZ = new THREE.Vector3(
    currentWorld.x - player.position.x,
    0,
    currentWorld.z - player.position.z
  );

  // Where the body WOULD need to be to keep the hand pinned at anchor
  const desired = new THREE.Vector3(
    state.anchorWorld.x - controllerLocalXZ.x,
    0,
    state.anchorWorld.z - controllerLocalXZ.z
  );

  const delta = new THREE.Vector3().subVectors(desired, player.position);
  if (delta.length() < DEAD_ZONE) delta.set(0, 0, 0);

  // Auto re-grab once "arm" has reached its max virtual reach
  const reachDist = currentWorld.distanceTo(state.anchorWorld);
  if (reachDist > REACH_LIMIT) {
    state.anchorWorld.copy(currentWorld);
  }

  return delta;
}

function updateLocomotion(dt) {
  updateHandFloorFeedback();

  const deltaL = processHandPull('left', controller1);
  const deltaR = processHandPull('right', controller2);

  const combined = new THREE.Vector3().addVectors(deltaL, deltaR);
  // Average if both hands contribute, otherwise use whichever is active
  const activeCount = (deltaL.lengthSq() > 0 ? 1 : 0) + (deltaR.lengthSq() > 0 ? 1 : 0);
  if (activeCount > 0) combined.divideScalar(activeCount);

  // Apply horizontal pull directly (this IS the arm-swing locomotion)
  let nextPos = player.position.clone();
  nextPos.x += combined.x;
  nextPos.z += combined.z;

  // Track horizontal velocity for slight momentum feel
  velocity.x = combined.x / Math.max(dt, 0.0001) * 0.3 + velocity.x * 0.7;
  velocity.z = combined.z / Math.max(dt, 0.0001) * 0.3 + velocity.z * 0.7;

  // Gravity always applies to Y independently
  velocity.y -= GRAVITY * dt;
  nextPos.y = player.position.y + velocity.y * dt;

  if (nextPos.y < 0) {
    nextPos.y = 0;
    velocity.y = 0;
  }

  // Light drag so leftover velocity doesn't carry forever
  velocity.x *= 0.9;
  velocity.z *= 0.9;

  nextPos = resolveCollisionsXZ(nextPos);
  player.position.copy(nextPos);

  if (player.position.y < -30) {
    player.position.set(0, 0, 0);
    velocity.set(0, 0, 0);
  }
}

function onResize() {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
}

function render() {
  const dt = Math.min(clock.getDelta(), 0.1);
  updateLocomotion(dt);
  renderer.render(scene, camera);
}
</script>
</body>
</html>
