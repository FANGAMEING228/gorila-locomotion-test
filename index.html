<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Arm Swing VR Locomotion</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #000; }
  #info {
    position: fixed; top: 10px; width: 100%; text-align: center;
    color: white; font-family: sans-serif; z-index: 10; pointer-events: none;
  }
</style>
</head>
<body>
<div id="info">Just swing your arms (like running) to move. No buttons needed. Colliders active.</div>

<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
  }
}
</script>

<script type="module">
import * as THREE from 'three';
import { VRButton } from 'three/addons/webxr/VRButton.js';

let scene, camera, renderer, clock;
let player;
let controller1, controller2;

const velocity = new THREE.Vector3();
const GRAVITY = 9.8;
const PLAYER_RADIUS = 0.4;
const WORLD_LIMIT = 480;

// Track previous world positions of controllers to compute swing speed
const prevPos1 = new THREE.Vector3();
const prevPos2 = new THREE.Vector3();
let hasPrev = false;

const colliders = [];

init();
renderer.setAnimationLoop(render);

function init() {
  scene = new THREE.Scene();
  scene.background = new THREE.Color(0x8fd3ff);

  camera = new THREE.PerspectiveCamera(70, window.innerWidth / window.innerHeight, 0.01, 1000);

  player = new THREE.Group();
  player.position.set(0, 0, 0);
  player.add(camera);
  scene.add(player);

  const hemi = new THREE.HemisphereLight(0xffffff, 0x444444, 1.2);
  hemi.position.set(0, 20, 0);
  scene.add(hemi);

  const dir = new THREE.DirectionalLight(0xffffff, 1.2);
  dir.position.set(20, 30, 10);
  scene.add(dir);

  // ---- BIG BASEPLATE ----
  const groundGeo = new THREE.PlaneGeometry(1000, 1000);
  const groundMat = new THREE.MeshStandardMaterial({ color: 0x2e8b2e });
  const ground = new THREE.Mesh(groundGeo, groundMat);
  ground.rotation.x = -Math.PI / 2;
  scene.add(ground);

  const grid = new THREE.GridHelper(1000, 200, 0x000000, 0x000000);
  grid.material.transparent = true;
  grid.material.opacity = 0.15;
  scene.add(grid);

  // ---- COLLIDABLE REFERENCE BOXES ----
  const boxGeo = new THREE.BoxGeometry(2, 2, 2);
  for (let i = 0; i < 60; i++) {
    const mat = new THREE.MeshStandardMaterial({ color: Math.random() * 0xffffff });
    const box = new THREE.Mesh(boxGeo, mat);
    box.position.set((Math.random() - 0.5) * 200, 1, (Math.random() - 0.5) * 200);
    scene.add(box);

    box.updateMatrixWorld();
    const bbox = new THREE.Box3().setFromObject(box);
    colliders.push(bbox);
  }

  // ---- RENDERER / VR ----
  renderer = new THREE.WebGLRenderer({ antialias: true });
  renderer.setPixelRatio(window.devicePixelRatio);
  renderer.setSize(window.innerWidth, window.innerHeight);
  renderer.xr.enabled = true;
  renderer.xr.setReferenceSpaceType('local-floor');
  document.body.appendChild(renderer.domElement);
  document.body.appendChild(VRButton.createButton(renderer));

  // ---- CONTROLLERS ----
  controller1 = renderer.xr.getController(0);
  controller2 = renderer.xr.getController(1);
  player.add(controller1);
  player.add(controller2);

  const handGeo = new THREE.SphereGeometry(0.06, 16, 16);
  const handMat1 = new THREE.MeshStandardMaterial({ color: 0xffcc00 });
  const handMat2 = new THREE.MeshStandardMaterial({ color: 0xff5500 });
  controller1.add(new THREE.Mesh(handGeo, handMat1));
  controller2.add(new THREE.Mesh(handGeo, handMat2));

  clock = new THREE.Clock();
  window.addEventListener('resize', onResize);
}

function resolveCollisions(nextPos) {
  const playerSphere = new THREE.Sphere(
    new THREE.Vector3(nextPos.x, nextPos.y + 1, nextPos.z),
    PLAYER_RADIUS
  );

  for (const box of colliders) {
    const closest = new THREE.Vector3();
    box.clampPoint(playerSphere.center, closest);
    const dist = playerSphere.center.distanceTo(closest);

    if (dist < playerSphere.radius) {
      const pushDir = new THREE.Vector3().subVectors(playerSphere.center, closest);
      if (pushDir.lengthSq() === 0) pushDir.set(1, 0, 0);
      pushDir.normalize();
      const overlap = playerSphere.radius - dist;
      nextPos.x += pushDir.x * overlap;
      nextPos.z += pushDir.z * overlap;
    }
  }

  const distFromCenter = Math.sqrt(nextPos.x * nextPos.x + nextPos.z * nextPos.z);
  if (distFromCenter > WORLD_LIMIT) {
    const scale = WORLD_LIMIT / distFromCenter;
    nextPos.x *= scale;
    nextPos.z *= scale;
  }

  return nextPos;
}

function updateArmSwing(dt) {
  const worldPos1 = new THREE.Vector3();
  const worldPos2 = new THREE.Vector3();
  controller1.getWorldPosition(worldPos1);
  controller2.getWorldPosition(worldPos2);

  if (!hasPrev) {
    prevPos1.copy(worldPos1);
    prevPos2.copy(worldPos2);
    hasPrev = true;
    return;
  }

  // Velocity of each hand (per second)
  const vel1 = new THREE.Vector3().subVectors(worldPos1, prevPos1).divideScalar(dt);
  const vel2 = new THREE.Vector3().subVectors(worldPos2, prevPos2).divideScalar(dt);

  prevPos1.copy(worldPos1);
  prevPos2.copy(worldPos2);

  // Only count horizontal-ish swing speed (ignore pure up/down noise a bit)
  const speed1 = Math.sqrt(vel1.x * vel1.x + vel1.z * vel1.z + Math.abs(vel1.y) * 0.5);
  const speed2 = Math.sqrt(vel2.x * vel2.x + vel2.z * vel2.z + Math.abs(vel2.y) * 0.5);

  const threshold = 0.6; // minimum swing speed to start moving
  const maxSpeedCap = 6.0;

  let swingPower = 0;
  if (speed1 > threshold) swingPower += Math.min(speed1, maxSpeedCap) - threshold;
  if (speed2 > threshold) swingPower += Math.min(speed2, maxSpeedCap) - threshold;

  if (swingPower > 0) {
    // Move in the direction the player is facing (head yaw), not where hands point
    const camDir = new THREE.Vector3();
    camera.getWorldDirection(camDir);
    camDir.y = 0;
    camDir.normalize();

    const pushForce = swingPower * 1.2; // tune multiplier for speed feel
    velocity.x += camDir.x * pushForce * dt;
    velocity.z += camDir.z * pushForce * dt;
  }
}

function updateLocomotion(dt) {
  updateArmSwing(dt);

  let nextPos = player.position.clone();

  // Gravity
  velocity.y -= GRAVITY * dt;
  nextPos.addScaledVector(velocity, dt);

  if (nextPos.y < 0) {
    nextPos.y = 0;
    velocity.y = 0;
  }

  // Friction/drag so you slow down naturally when you stop swinging
  velocity.x *= 0.95;
  velocity.z *= 0.95;

  nextPos = resolveCollisions(nextPos);
  player.position.copy(nextPos);

  if (player.position.y < -30) {
    player.position.set(0, 0, 0);
    velocity.set(0, 0, 0);
  }
}

function onResize() {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
}

function render() {
  const dt = Math.min(clock.getDelta(), 0.1);
  updateLocomotion(dt);
  renderer.render(scene, camera);
}
</script>
</body>
</html>
