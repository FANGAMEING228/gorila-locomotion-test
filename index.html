<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>VR Locomotion + Collision</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #000; }
  #info {
    position: fixed; top: 10px; width: 100%; text-align: center;
    color: white; font-family: sans-serif; z-index: 10; pointer-events: none;
  }
</style>
</head>
<body>
<div id="info">Push joystick to walk (no button needed). Grip = Gorilla-Tag arm-swing pull. Collides with boxes & world edge.</div>

<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
  }
}
</script>

<script type="module">
import * as THREE from 'three';
import { VRButton } from 'three/addons/webxr/VRButton.js';

let scene, camera, renderer, clock;
let player;
let controller1, controller2;

const velocity = new THREE.Vector3();
const GRAVITY = 9.8;
const PLAYER_RADIUS = 0.4;
const WORLD_LIMIT = 480; // boundary radius of the baseplate

const grabState = {
  left:  { grabbing: false, anchor: new THREE.Vector3() },
  right: { grabbing: false, anchor: new THREE.Vector3() }
};

const colliders = []; // { box: THREE.Box3 }

init();
renderer.setAnimationLoop(render);

function init() {
  scene = new THREE.Scene();
  scene.background = new THREE.Color(0x8fd3ff);

  camera = new THREE.PerspectiveCamera(70, window.innerWidth / window.innerHeight, 0.01, 1000);

  player = new THREE.Group();
  player.position.set(0, 0, 0);
  player.add(camera);
  scene.add(player);

  const hemi = new THREE.HemisphereLight(0xffffff, 0x444444, 1.2);
  hemi.position.set(0, 20, 0);
  scene.add(hemi);

  const dir = new THREE.DirectionalLight(0xffffff, 1.2);
  dir.position.set(20, 30, 10);
  scene.add(dir);

  // ---- BIG BASEPLATE ----
  const groundGeo = new THREE.PlaneGeometry(1000, 1000);
  const groundMat = new THREE.MeshStandardMaterial({ color: 0x2e8b2e });
  const ground = new THREE.Mesh(groundGeo, groundMat);
  ground.rotation.x = -Math.PI / 2;
  scene.add(ground);

  const grid = new THREE.GridHelper(1000, 200, 0x000000, 0x000000);
  grid.material.transparent = true;
  grid.material.opacity = 0.15;
  scene.add(grid);

  // ---- COLLIDABLE REFERENCE BOXES ----
  const boxGeo = new THREE.BoxGeometry(2, 2, 2);
  for (let i = 0; i < 60; i++) {
    const mat = new THREE.MeshStandardMaterial({ color: Math.random() * 0xffffff });
    const box = new THREE.Mesh(boxGeo, mat);
    box.position.set((Math.random() - 0.5) * 200, 1, (Math.random() - 0.5) * 200);
    scene.add(box);

    box.updateMatrixWorld();
    const bbox = new THREE.Box3().setFromObject(box);
    colliders.push(bbox);
  }

  // ---- RENDERER / VR ----
  renderer = new THREE.WebGLRenderer({ antialias: true });
  renderer.setPixelRatio(window.devicePixelRatio);
  renderer.setSize(window.innerWidth, window.innerHeight);
  renderer.xr.enabled = true;
  renderer.xr.setReferenceSpaceType('local-floor');
  document.body.appendChild(renderer.domElement);
  document.body.appendChild(VRButton.createButton(renderer));

  // ---- CONTROLLERS ----
  controller1 = renderer.xr.getController(0);
  controller2 = renderer.xr.getController(1);
  player.add(controller1);
  player.add(controller2);

  const handGeo = new THREE.SphereGeometry(0.06, 16, 16);
  const handMat1 = new THREE.MeshStandardMaterial({ color: 0xffcc00 });
  const handMat2 = new THREE.MeshStandardMaterial({ color: 0xff5500 });
  controller1.add(new THREE.Mesh(handGeo, handMat1));
  controller2.add(new THREE.Mesh(handGeo, handMat2));

  controller1.addEventListener('squeezestart', () => onGrabStart('left'));
  controller1.addEventListener('squeezeend', () => onGrabEnd('left'));
  controller2.addEventListener('squeezestart', () => onGrabStart('right'));
  controller2.addEventListener('squeezeend', () => onGrabEnd('right'));

  clock = new THREE.Clock();
  window.addEventListener('resize', onResize);
}

function onGrabStart(hand) {
  const controller = hand === 'left' ? controller1 : controller2;
  const state = grabState[hand];
  state.grabbing = true;
  controller.getWorldPosition(state.anchor);
}

function onGrabEnd(hand) {
  grabState[hand].grabbing = false;
}

// ---- JOYSTICK MOVEMENT (no button press needed) ----
function getThumbstickMove() {
  const session = renderer.xr.getSession();
  if (!session) return new THREE.Vector3();

  const move = new THREE.Vector3();
  for (const source of session.inputSources) {
    if (!source.gamepad) continue;
    const axes = source.gamepad.axes;
    // axes[2], axes[3] are typical thumbstick X/Y on Quest controllers
    const x = axes[2] || 0;
    const y = axes[3] || 0;
    if (Math.abs(x) > 0.15 || Math.abs(y) > 0.15) {
      const camDir = new THREE.Vector3();
      camera.getWorldDirection(camDir);
      camDir.y = 0;
      camDir.normalize();
      const camRight = new THREE.Vector3().crossVectors(camDir, new THREE.Vector3(0, 1, 0)).negate();

      move.addScaledVector(camDir, -y);
      move.addScaledVector(camRight, x);
    }
  }
  return move;
}

function resolveCollisions(nextPos) {
  // Sphere vs AABB resolution
  const playerSphere = new THREE.Sphere(
    new THREE.Vector3(nextPos.x, nextPos.y + 1, nextPos.z),
    PLAYER_RADIUS
  );

  for (const box of colliders) {
    const closest = new THREE.Vector3();
    box.clampPoint(playerSphere.center, closest);
    const dist = playerSphere.center.distanceTo(closest);

    if (dist < playerSphere.radius) {
      const pushDir = new THREE.Vector3().subVectors(playerSphere.center, closest);
      if (pushDir.lengthSq() === 0) pushDir.set(1, 0, 0);
      pushDir.normalize();
      const overlap = playerSphere.radius - dist;
      nextPos.x += pushDir.x * overlap;
      nextPos.z += pushDir.z * overlap;
    }
  }

  // World boundary (circular wall)
  const distFromCenter = Math.sqrt(nextPos.x * nextPos.x + nextPos.z * nextPos.z);
  if (distFromCenter > WORLD_LIMIT) {
    const scale = WORLD_LIMIT / distFromCenter;
    nextPos.x *= scale;
    nextPos.z *= scale;
  }

  return nextPos;
}

function updateLocomotion(dt) {
  const grabTargets = [];

  ['left', 'right'].forEach(hand => {
    const state = grabState[hand];
    if (state.grabbing) {
      const controller = hand === 'left' ? controller1 : controller2;
      const target = state.anchor.clone().sub(controller.position);
      grabTargets.push(target);
    }
  });

  let nextPos = player.position.clone();

  if (grabTargets.length > 0) {
    // Gorilla-tag style grab pull
    const avg = new THREE.Vector3();
    grabTargets.forEach(t => avg.add(t));
    avg.divideScalar(grabTargets.length);

    velocity.copy(avg).sub(player.position).divideScalar(Math.max(dt, 0.0001));
    nextPos.copy(avg);
  } else {
    // Joystick-driven smooth movement
    const moveInput = getThumbstickMove();
    const speed = 3.0;
    nextPos.addScaledVector(moveInput, speed * dt);

    // Gravity + momentum
    velocity.y -= GRAVITY * dt;
    nextPos.addScaledVector(velocity, dt);

    if (nextPos.y < 0) {
      nextPos.y = 0;
      velocity.y = 0;
      velocity.x *= 0.9;
      velocity.z *= 0.9;
    }
    velocity.x *= 0.98;
    velocity.z *= 0.98;
  }

  // ---- Apply collision resolution ----
  nextPos = resolveCollisions(nextPos);

  player.position.copy(nextPos);

  // Safety reset if you fall off the world
  if (player.position.y < -30) {
    player.position.set(0, 0, 0);
    velocity.set(0, 0, 0);
  }
}

function onResize() {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
}

function render() {
  const dt = Math.min(clock.getDelta(), 0.1);
  updateLocomotion(dt);
  renderer.render(scene, camera);
}
</script>
</body>
</html>
