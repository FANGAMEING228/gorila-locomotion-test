<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Real Gorilla Tag Locomotion</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #000; }
  #info {
    position: fixed; top: 10px; width: 100%; text-align: center;
    color: white; font-family: sans-serif; z-index: 10; pointer-events: none;
  }
</style>
</head>
<body>
<div id="info">Squeeze GRIP to grab air/ground, pull your arm to swing your body, release for momentum. Alternate hands to run.</div>

<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
  }
}
</script>

<script type="module">
import * as THREE from 'three';
import { VRButton } from 'three/addons/webxr/VRButton.js';

let scene, camera, renderer, clock;
let player;
let controller1, controller2;
let hand1Mesh, hand2Mesh;

const velocity = new THREE.Vector3();
const GRAVITY = 9.8;
const PLAYER_RADIUS = 0.4;
const WORLD_LIMIT = 480;
const FLOOR_TOUCH_HEIGHT = 0.15;

const colliders = [];

// Grab state per hand
const grabState = {
  left:  { grabbing: false, anchorWorld: new THREE.Vector3(), lastControllerWorld: new THREE.Vector3(), velSamples: [] },
  right: { grabbing: false, anchorWorld: new THREE.Vector3(), lastControllerWorld: new THREE.Vector3(), velSamples: [] }
};

init();
renderer.setAnimationLoop(render);

function init() {
  scene = new THREE.Scene();
  scene.background = new THREE.Color(0x8fd3ff);

  camera = new THREE.PerspectiveCamera(70, window.innerWidth / window.innerHeight, 0.01, 1000);

  player = new THREE.Group();
  player.position.set(0, 0, 0);
  player.add(camera);
  scene.add(player);

  const hemi = new THREE.HemisphereLight(0xffffff, 0x444444, 1.2);
  hemi.position.set(0, 20, 0);
  scene.add(hemi);

  const dir = new THREE.DirectionalLight(0xffffff, 1.2);
  dir.position.set(20, 30, 10);
  scene.add(dir);

  // ---- BIG BASEPLATE ----
  const groundGeo = new THREE.PlaneGeometry(1000, 1000);
  const groundMat = new THREE.MeshStandardMaterial({ color: 0x2e8b2e });
  const ground = new THREE.Mesh(groundGeo, groundMat);
  ground.rotation.x = -Math.PI / 2;
  scene.add(ground);

  const grid = new THREE.GridHelper(1000, 200, 0x000000, 0x000000);
  grid.material.transparent = true;
  grid.material.opacity = 0.15;
  scene.add(grid);

  // ---- COLLIDABLE REFERENCE BOXES ----
  const boxGeo = new THREE.BoxGeometry(2, 2, 2);
  for (let i = 0; i < 60; i++) {
    const mat = new THREE.MeshStandardMaterial({ color: Math.random() * 0xffffff });
    const box = new THREE.Mesh(boxGeo, mat);
    box.position.set((Math.random() - 0.5) * 200, 1, (Math.random() - 0.5) * 200);
    scene.add(box);

    box.updateMatrixWorld();
    const bbox = new THREE.Box3().setFromObject(box);
    colliders.push(bbox);
  }

  // ---- RENDERER / VR ----
  renderer = new THREE.WebGLRenderer({ antialias: true });
  renderer.setPixelRatio(window.devicePixelRatio);
  renderer.setSize(window.innerWidth, window.innerHeight);
  renderer.xr.enabled = true;
  renderer.xr.setReferenceSpaceType('local-floor');
  document.body.appendChild(renderer.domElement);
  document.body.appendChild(VRButton.createButton(renderer));

  // ---- CONTROLLERS ----
  controller1 = renderer.xr.getController(0);
  controller2 = renderer.xr.getController(1);
  player.add(controller1);
  player.add(controller2);

  const handGeo = new THREE.SphereGeometry(0.07, 16, 16);
  const handMat1 = new THREE.MeshStandardMaterial({ color: 0xffcc00 });
  const handMat2 = new THREE.MeshStandardMaterial({ color: 0xff5500 });
  hand1Mesh = new THREE.Mesh(handGeo, handMat1);
  hand2Mesh = new THREE.Mesh(handGeo, handMat2);
  controller1.add(hand1Mesh);
  controller2.add(hand2Mesh);

  controller1.addEventListener('squeezestart', () => onGrabStart('left'));
  controller1.addEventListener('squeezeend', () => onGrabEnd('left'));
  controller2.addEventListener('squeezestart', () => onGrabStart('right'));
  controller2.addEventListener('squeezeend', () => onGrabEnd('right'));

  clock = new THREE.Clock();
  window.addEventListener('resize', onResize);
}

function onGrabStart(hand) {
  const controller = hand === 'left' ? controller1 : controller2;
  const state = grabState[hand];
  state.grabbing = true;
  controller.getWorldPosition(state.anchorWorld);
  controller.getWorldPosition(state.lastControllerWorld);
  state.velSamples = [];
}

function onGrabEnd(hand) {
  const state = grabState[hand];
  state.grabbing = false;

  // Apply averaged recent hand velocity as release momentum
  if (state.velSamples.length > 0) {
    const avg = new THREE.Vector3();
    state.velSamples.forEach(v => avg.add(v));
    avg.divideScalar(state.velSamples.length);
    // The hand moving in direction X means body should fling in -X (pull-release)
    velocity.add(avg.multiplyScalar(-1));
  }
}

function resolveCollisions(nextPos) {
  const playerSphere = new THREE.Sphere(
    new THREE.Vector3(nextPos.x, nextPos.y + 1, nextPos.z),
    PLAYER_RADIUS
  );

  for (const box of colliders) {
    const closest = new THREE.Vector3();
    box.clampPoint(playerSphere.center, closest);
    const dist = playerSphere.center.distanceTo(closest);

    if (dist < playerSphere.radius) {
      const pushDir = new THREE.Vector3().subVectors(playerSphere.center, closest);
      if (pushDir.lengthSq() === 0) pushDir.set(1, 0, 0);
      pushDir.normalize();
      const overlap = playerSphere.radius - dist;
      nextPos.x += pushDir.x * overlap;
      nextPos.z += pushDir.z * overlap;
    }
  }

  const distFromCenter = Math.sqrt(nextPos.x * nextPos.x + nextPos.z * nextPos.z);
  if (distFromCenter > WORLD_LIMIT) {
    const scale = WORLD_LIMIT / distFromCenter;
    nextPos.x *= scale;
    nextPos.z *= scale;
  }

  return nextPos;
}

function updateHandFloorFeedback() {
  [controller1, controller2].forEach((controller, i) => {
    const worldPos = new THREE.Vector3();
    controller.getWorldPosition(worldPos);
    const mesh = i === 0 ? hand1Mesh : hand2Mesh;
    if (worldPos.y <= FLOOR_TOUCH_HEIGHT) {
      mesh.material.color.set(0x00ff00); // green = touching floor
      mesh.scale.setScalar(1.3);
    } else {
      mesh.material.color.set(i === 0 ? 0xffcc00 : 0xff5500);
      mesh.scale.setScalar(1.0);
    }
  });
}

function updateGrabPull(dt) {
  let bodyTargets = [];

  ['left', 'right'].forEach(hand => {
    const state = grabState[hand];
    if (!state.grabbing) return;

    const controller = hand === 'left' ? controller1 : controller2;
    const currentWorld = new THREE.Vector3();
    controller.getWorldPosition(currentWorld);

    // Track velocity sample for momentum on release
    const instVel = new THREE.Vector3().subVectors(currentWorld, state.lastControllerWorld).divideScalar(Math.max(dt, 0.0001));
    state.velSamples.push(instVel);
    if (state.velSamples.length > 6) state.velSamples.shift(); // keep recent samples only
    state.lastControllerWorld.copy(currentWorld);

    // The body should move so that the controller's LOCAL offset from body,
    // when added to new body position, equals the fixed world anchor.
    // controllerLocalPos = currentWorld - player.position (pre-move)
    const controllerLocalPos = new THREE.Vector3().subVectors(currentWorld, player.position);
    const desiredBodyPos = new THREE.Vector3().subVectors(state.anchorWorld, controllerLocalPos);
    bodyTargets.push(desiredBodyPos);
  });

  if (bodyTargets.length > 0) {
    const avgTarget = new THREE.Vector3();
    bodyTargets.forEach(t => avgTarget.add(t));
    avgTarget.divideScalar(bodyTargets.length);

    // Compute velocity for smooth continuation if still grabbing
    velocity.copy(avgTarget).sub(player.position).divideScalar(Math.max(dt, 0.0001));
    player.position.copy(avgTarget);
    return true; // currently being pulled
  }
  return false;
}

function updateLocomotion(dt) {
  const isPulling = updateGrabPull(dt);
  updateHandFloorFeedback();

  if (!isPulling) {
    // Free flight / momentum phase
    velocity.y -= GRAVITY * dt;

    let nextPos = player.position.clone().addScaledVector(velocity, dt);

    if (nextPos.y < 0) {
      nextPos.y = 0;
      velocity.y = 0;
      velocity.x *= 0.92; // ground friction
      velocity.z *= 0.92;
    } else {
      velocity.x *= 0.995; // air drag (keeps momentum longer, like real gtag)
      velocity.z *= 0.995;
    }

    nextPos = resolveCollisions(nextPos);
    player.position.copy(nextPos);
  } else {
    // Still resolve collisions even while pulling (prevents clipping through walls)
    const corrected = resolveCollisions(player.position.clone());
    player.position.copy(corrected);
  }

  if (player.position.y < -30) {
    player.position.set(0, 0, 0);
    velocity.set(0, 0, 0);
  }
}

function onResize() {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
}

function render() {
  const dt = Math.min(clock.getDelta(), 0.1);
  updateLocomotion(dt);
  renderer.render(scene, camera);
}
</script>
</body>
</html>
